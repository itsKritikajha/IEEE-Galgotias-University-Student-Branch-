<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="360" height="90" fill="none">
  <g id="ieee-embs-logo">
    <!-- Icon: EMBS ECG Pulse & Biomedical Cross / Helix Emblem -->
    <g transform="translate(10, 10)">
      <!-- Outer Biomedical Shield -->
      <rect x="2" y="2" width="66" height="66" rx="20" fill="#059669" fill-opacity="0.12" stroke="#10B981" stroke-width="2.5"/>
      
      <!-- Bio Cross Grid Light -->
      <path d="M 35 12 L 35 58 M 12 35 L 58 35" stroke="#10B981" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
      
      <!-- ECG Pulse Waveform -->
      <path d="M 12 35 L 23 35 L 27 24 L 33 46 L 39 16 L 45 42 L 49 35 L 58 35" stroke="#34D399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      
      <!-- Glowing Peak Dot -->
      <circle cx="39" cy="16" r="3.5" fill="#6EE7B7"/>
      <circle cx="39" cy="16" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- Typography -->
    <text x="88" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="1">IEEE</text>
    <text x="160" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="26" fill="#34D399" letter-spacing="0.5">EMBS</text>
    
    <text x="88" y="58" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#E2E8F0" letter-spacing="0.2">Engineering in Medicine &amp; Biology</text>
    <text x="88" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9.5" fill="#94A3B8" letter-spacing="1">BIOMEDICAL • HEALTHCARE TECH • BIO-AI</text>
  </g>
</svg>
