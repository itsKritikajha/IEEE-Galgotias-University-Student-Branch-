<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="360" height="90" fill="none">
  <g id="ieee-mtts-logo">
    <!-- Icon: MTT-S Microwave RF Waveguide / Smith Chart Emblem -->
    <g transform="translate(10, 10)">
      <!-- Outer Round RF Scope Ring -->
      <circle cx="35" cy="35" r="33" fill="#0284C7" fill-opacity="0.12" stroke="#0284C7" stroke-width="2.5" />
      <circle cx="35" cy="35" r="23" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6"/>
      
      <!-- Center Microwave Waveform -->
      <path d="M 12 35 Q 23 12, 35 35 T 58 35" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <path d="M 15 35 Q 25 22, 35 35 T 55 35" stroke="#0284C7" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
      
      <!-- Coordinate / Antenna crosshairs -->
      <line x1="35" y1="5" x2="35" y2="65" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
      <circle cx="35" cy="35" r="4" fill="#38BDF8"/>
      <circle cx="35" cy="35" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- Typography -->
    <text x="88" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="1">IEEE</text>
    <text x="160" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="26" fill="#38BDF8" letter-spacing="0.5">MTT-S</text>
    
    <text x="88" y="58" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#E2E8F0" letter-spacing="0.2">Microwave Theory &amp; Technology Society</text>
    <text x="88" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9.5" fill="#94A3B8" letter-spacing="1">RF • WIRELESS • TERAHERTZ • RADAR</text>
  </g>
</svg>
